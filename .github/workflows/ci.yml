name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the cluster test
        working-directory: test/cluster
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, fedora45, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      # A container can't load kernel modules, so the runner loads k3s's.
      - run: sudo modprobe -a br_netfilter overlay
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          # Rootless Podman doesn't hand containers the cpuset cgroup k3s needs.
          PODMAN: sudo podman
        run: ./up.sh
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
          sudo podman exec circuit-k3s k3s kubectl wait --for=condition=Ready node --all --timeout=2m
      - name: Clean up
        if: always()
        working-directory: examples/local
        env:
          PODMAN: sudo podman
        run: ./down.sh

  cluster:
    needs: validate
    runs-on: ubuntu-24.04
    name: cluster (2 servers, 1 agent)
    env:
      PODMAN: sudo podman
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - run: sudo modprobe -a br_netfilter overlay
      - name: Start three Ubuntu 24.04 hosts
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/ubuntu2404/Containerfile
        run: |
          for n in 1 2 3; do
            NAME=k3s-n$n PORT=222$n examples/local/up.sh
            cat examples/local/known_hosts >> test/cluster/known_hosts
          done
          cp examples/local/id_ed25519 test/cluster/
          echo "TF_VAR_server_ip=$(sudo podman inspect -f '{{.NetworkSettings.IPAddress}}' k3s-n1)" >> "$GITHUB_ENV"
      - name: Apply, then plan again with no changes
        working-directory: test/cluster
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      - name: Check all three nodes are Ready
        run: sudo podman exec k3s-n1 k3s kubectl wait --for=condition=Ready node --all --timeout=2m
      - name: Show the k3s logs
        if: failure()
        run: for n in 1 2 3; do sudo podman exec k3s-n$n journalctl -u 'k3s*' --no-pager -n 100 || true; done
      - name: Clean up
        if: always()
        run: for n in 1 2 3; do NAME=k3s-n$n examples/local/down.sh; done
